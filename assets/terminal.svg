<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Xenogix — Umeko has root</title>
  <desc id="desc">An amber terminal introducing Xenogix, C# and .NET projects, and Umeko's terminal at umeko.ch.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#271b0c"/><stop offset="1" stop-color="#140d04"/></radialGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#000" stroke-opacity=".13"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="448" rx="18" fill="url(#bg)" stroke="#604421" stroke-width="2"/>
  <path d="M1 58H1199" stroke="#604421"/>
  <g fill="#9c6c26"><circle cx="30" cy="30" r="6"/><circle cx="52" cy="30" r="6"/><circle cx="74" cy="30" r="6"/></g>
  <g font-family="'Courier New',monospace">
    <text x="600" y="37" text-anchor="middle" fill="#c69a55" font-size="18">guest@xenogix: ~</text>
    <text x="46" y="115" fill="#9c6c26" font-size="22">$ whoami</text>
    <text x="44" y="174" fill="#ffe6ad" font-size="52" font-weight="bold" letter-spacing="-2">Arthur / Xenogix</text>
    <text x="46" y="223" fill="#ffb641" font-size="22">C# · .NET · self-hosting · experiments</text>
    <text x="46" y="292" fill="#9c6c26" font-size="22">$ ssh umeko</text>
    <text x="46" y="330" fill="#ffe6ad" font-size="23">Connection established. The cat has root.</text>
    <text x="46" y="401" fill="#ffb641" font-size="22">Open terminal → umeko.ch</text>
    <rect x="390" y="382" width="12" height="23" fill="#ffb641"/>
    <g fill="#ffb641" font-size="28" xml:space="preserve">
      <text x="950" y="150"> /\_/\</text>
      <text x="950" y="188">( o.o )</text>
      <text x="950" y="226"> &gt; ^ &lt;</text>
    </g>
    <text x="981" y="278" fill="#9c6c26" font-size="16">uid=0(cat)</text>
  </g>
  <rect x="2" y="2" width="1196" height="446" rx="17" fill="url(#lines)"/>
</svg>
